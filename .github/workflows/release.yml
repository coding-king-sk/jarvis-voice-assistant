name: Release

# Do tarike se chalta hai:
#  1. Tag push karo:  git tag v1.0.5 && git push origin v1.0.5
#  2. GitHub UI -> Actions -> Release -> Run workflow -> version daalo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (jaise v1.0.5)'
        required: true
        default: 'v1.0.5'
      prerelease:
        description: 'Pre-release hai?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject Anthropic API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret nahi mila — app me dimaag kaam nahi karega"
          fi
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> local.properties

      # Bina signature wala APK install nahi hota.
      # Secret ho to wahi keystore, warna ek bana lo.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secret"
            echo "$KEYSTORE_BASE64" | base64 -d > jarvis.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="${KEY_ALIAS:-jarvis}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No keystore secret found, generating a temporary one"
            STORE_PASS="jarvis-temp-key"
            ALIAS="jarvis"
            KEY_PASS="jarvis-temp-key"
            keytool -genkeypair \
              -keystore jarvis.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Jarvis, OU=Dev, O=Jarvis, L=Jaipur, ST=Rajasthan, C=IN"
          fi
          printf 'storeFile=jarvis.keystore\n' > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASS" >> keystore.properties
          printf 'keyAlias=%s\n' "$ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASS" >> keystore.properties

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect and verify APK
        id: apk
        run: |
          set -e
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Signed APK nahi mila — signing config check karo"
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          echo "Found APK: $APK"

          # apksigner se verify karo. Modern APK sirf v2/v3 se sign hote hain,
          # unme META-INF/*.RSA nahi hoti — isliye zip me dhoondhna galat hai.
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying with $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "apksigner nahi mila, zip fallback check"
            if ! unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
              echo "::error::APK signed nahi lag raha"
              exit 1
            fi
          fi

          cp "$APK" "dist/jarvis-${{ steps.version.outputs.version }}.apk"
          echo "path=dist/jarvis-${{ steps.version.outputs.version }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' --no-merges | head -n 30)
          else
            LOG=$(git log "$PREV"..HEAD --pretty=format:'- %s (%h)' --no-merges)
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$LOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Jarvis ${{ steps.version.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: false
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Jarvis ${{ steps.version.outputs.version }}

            Android voice assistant - custom wake word, Hinglish baat-cheet,
            Claude ka dimaag, aur yaad rakhne wali memory.

            ### Install karna

            1. Neeche Assets se `jarvis-${{ steps.version.outputs.version }}.apk` download karo
            2. Purana Jarvis install hai to pehle **uninstall** karo (signature badal sakti hai)
            3. "Unknown sources se install" allow karo
            4. Install karke saari permissions Allow karo (mic, contacts, camera)
            5. Settings -> Accessibility -> Jarvis on karo

            > Dimaag chalane ke liye repo Secret me `ANTHROPIC_API_KEY` hona chahiye.
            > Anthropic free nahi hai — account me thoda credit rakhna padta hai.

            ### Is release me

            ${{ steps.changelog.outputs.body }}
